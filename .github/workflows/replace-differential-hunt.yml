name: replace-differential-hunt

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes per job"
        default: "355"
  schedule:
    - cron: "0 */6 * * *"

jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed_base: [1000, 2500, 4000, 5500, 7000, 8500, 10000, 11500, 13000, 14500, 16000, 17500, 19000, 20500, 22000, 23500, 25000, 26500, 28000, 29500, 31000, 32500, 34000, 35500]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Build simulator
        run: cargo build --bin limbo_sim --release

      - name: Differential hunt (turso vs sqlite)
        run: |
          SEED=$(( ${{ matrix.seed_base }} + RANDOM % 2000 ))
          echo "hunt seed=$SEED"
          MINUTES=${{ github.event.inputs.minutes || '355' }}
          set +e
          timeout $(( MINUTES * 60 )) ./target/release/limbo_sim \
            --differential -s "$SEED" -n 20000 -k 2000 2>&1 | tee sim.log
          echo "exit=$?" >> "$GITHUB_ENV"
          # Real findings: one engine failed while the other did NOT, or
          # results diverged. "both fail" warnings are error-taxonomy noise.
          grep -nE "mismatch|corrupt|InternalError|assertion|panicked|divergence|ResultMismatch" sim.log | head -100 > findings.txt || true
          # Also flag the interesting half: limbo failed but rusqlite succeeded
          grep -B2 -A2 "limbo error" sim.log | grep -A2 -B2 -v "rusqlite error" | head -40 >> findings.txt || true
          cat findings.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-${{ matrix.seed_base }}-${{ github.run_id }}
          path: |
            sim.log
            findings.txt
            .bugbase
          retention-days: 7
